[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineeringstack"
version = "0.1.0"
description = "LangGraph hierarchical multi-agent engineering stack SDK package"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "fastapi>=0.141.1",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "mcp[cli]>=2.0.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[tool.setuptools.packages.find]
where = ["src"]
