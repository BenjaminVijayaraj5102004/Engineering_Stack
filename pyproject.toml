[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineeringstack"
version = "0.1.7"
description = "LangGraph hierarchical multi-agent engineering stack SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Engineering Stack Team" }
]
keywords = [
    "langgraph",
    "deepagents",
    "multi-agent",
    "ai",
    "engineering",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "deepagents",
    "fastapi>=0.141.1",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langsmith>=0.10.17",
    "mcp[cli]>=2.0.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[project.urls]
Homepage = "https://github.com/engineering-stack/engineeringstack"
Documentation = "https://github.com/engineering-stack/engineeringstack#readme"
Repository = "https://github.com/engineering-stack/engineeringstack.git"
Issues = "https://github.com/engineering-stack/engineeringstack/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineeringstack = [
    "py.typed",
    "**/*.json",
    "**/*.md",
    "**/*.yaml",
    "**/*.yml",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


